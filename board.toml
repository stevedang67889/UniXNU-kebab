# Board description of the OnePlus 8T (kebab, SM8250), read by the unixnu build driver.
#
# First milestone: get `unixnu build kernel` to produce kernel.macho for kebab.
# The [firmware] and [payload] sections are present but not yet validated; the
# firmware we actually flash is built from our own Mu-Silicium tree.

[board]
name = "kebab"
soc = "SM8250"
description = "OnePlus 8T"
kit = "kebab"        # device kit name; package/ is mapped there

# Donor IPSW: identical to the sheng port.  The kernel is built from Apple's XNU
# source and prelinked against this kernelcache, so the donor only has to match
# the XNU version and prelink ABI - it is not a device we emulate.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# GPT entry "userdata" on LU0. The 12+256 KB2000 unit reports
#   partition-size:userdata = 0x365D3DB000 = 233,492,557,824 bytes
#   => 57,005,019 logical blocks of 4096 bytes.
# first_lba still needs a GPT read (root shell or the UEFI block device):
# the values below came from another unit and do NOT match this one.
[userdata]
first_lba = 0          # TODO(measure): sgdisk -p /dev/block/sda
last_lba = 57005018    # first_lba + 57,005,019 - 1
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "kebab_defconfig"
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-libpthread-kernel.py",
  "build-kebab-stubs.py",
]

# Values below match the donor kernelcache pinned above, so they are carried
# over from the sheng port unchanged.  Re-check them if the IPSW ever changes.
[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.security.AppleImage4",
]

# Firmware built from our own Mu-Silicium tree (used by `unixnu build firmware`
# and by the boot image step; not needed for `unixnu build kernel`).
[firmware]
config = "kebab"
dsc = "Platforms/OnePlus/kebabPkg/kebab.dsc"
fd = "Build/kebabPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/OnePlus",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
  "{tree}/package",
]
# Mu-Silicium expects these on the command line (its own build_uefi.py passes them).
defines = { ENABLE_SECUREBOOT = 0, DEVICE_MODEL = 0 }

# Apple device tree for the kebab board. The hardware values come from this
# device's own firmware: MADT (GICv3 0x17A00000 / 0x17A60000), MemoryMapLib
# (DRAM base 0x80000000), and the UFS host controller measured at 0x01D84000.
[payload.adt]
tool = "scripts/make-kebab-adt.py"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
ipad_identity = false            # iPad-class identity (tablet idiom)
iphone_identity = true          # iPhone X identity: phone idiom, iPhone10,3 / D22AP.
                                 # Only /product, /buttons and the root model change;
                                 # the hardware nodes stay SM8250-specific.
                                 # The donor kernelcache is still the iPad7,1 ABI.
chip_id = "0x8250"
unique_chip_id = "required"      # supplied at build time, never stored here

# The payload volume DarwinBoot reads: the kernel, its device tree and the
# optional trust cache and Data seed. The loader is part of the firmware volume.
[payload]
volume = "KEBABESP"
size_mib = 64
loader = "firmware"
title = "kebab first boot: source 4K XNU to console"
# This unit is the 12 GiB SKU (owner-confirmed). The firmware still prints its
# own measurement as "[XNU-HW] dram_size=..." so the value can be cross-checked
# against the physical map on the next boot.
dram_size = "0x300000000"
panic_screen = false           # needs Font.h from the UEFI tree; enabled later
# Terminal PSCI reset at the first instruction of this kernel function: tells
# us whether execution reaches high-VA arm_init at all, with no console.
# reset_at = "_arm_init"  # the console marks instead
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
]

# OnePlus ABL on kebab: try header v2 / 4096-byte pages (stock layout) if v1/2048
# leaves the phone sitting in the bootloader after "fastboot boot".
[bootimg.image]
header_version = 2
pagesize = 4096
