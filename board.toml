schema_version = 2

# Board description of the OnePlus 8T (kebab, SM8250), read by the unixnu build
# driver. Format 2: SoC resources come from UniXNU-sm8250-common, the OS profile
# from the UniXNU base profiles, and this file keeps the board wiring.

[board]
name = "kebab"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "OnePlus 8T"
kit = "kebab"        # device package/ appears as kits/kebab

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

# Donor IPSW: the kernel is built from Apple's XNU source and prelinked against
# this kernelcache, so the donor only has to match the XNU version and prelink
# ABI - it is not a device we emulate.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# GPT entry "userdata" on LU0. The 12+256 KB2000 unit reports
#   partition-size:userdata = 0x365D3DB000 = 233,492,557,824 bytes
#   => 57,005,019 logical blocks of 4096 bytes.
[userdata]
first_lba = 4748320    # GPT of the KB2000 9008 package (gpt_main0.bin)
last_lba = 61748338    # first + 57,005,019 - 1 (measured partition size)
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "kebab_defconfig"
config_fragments = ["soc:configs/sm8250.config"]
patch_series = ["soc:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  "build-libpthread-kernel.py",
  "build-kebab-stubs.py",
]

# Values below match the donor kernelcache pinned above; re-check them if the
# IPSW ever changes.
[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-0x1000000"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.security.AppleImage4",
]

# Board device tree. dts/kebab.dts is the tree this unit runs: it keeps the
# splash reservation ABL needs and the controller nodes the firmware relies on.
[device_tree]
source = "device:dts/kebab.dts"
include_dirs = ["soc:dts"]

# Firmware built from our Mu-Silicium tree.
[firmware]
config = "kebab"
dsc = "Platforms/OnePlus/kebabPkg/kebab.dsc"
fd = "Build/kebabPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
packages = [
  "{uefi}",
  "{uefi}/Platforms/OnePlus",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/OnePlus",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
  "{tree}/package",
  "{tree}/drivers",
  "{tree}/drivers/DarwinBoot",
]
defines = { ENABLE_SECUREBOOT = 0, DEVICE_MODEL = 0 }

# Apple device tree for the kebab board. The hardware values come from this
# device's own firmware: MADT (GICv3 0x17A00000 / 0x17A60000), MemoryMapLib
# (DRAM base 0x80000000), and the UFS host controller measured at 0x01D84000.
[payload.adt]
owned_memory_size = "0xC0000000"   # DarwinBoot window: 256 MiB is too small for arm_vm_init
tool = "scripts/make-kebab-adt.py"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
ipad_identity = false
iphone_identity = true
chip_id = "0x8250"
unique_chip_id = "required"

# The payload volume DarwinBoot reads: the kernel, its device tree and the
# optional trust cache and Data seed. The loader is part of the firmware volume.
[payload]
volume = "KEBABESP"
size_mib = 64
loader = "firmware"
title = "kebab first boot: source 4K XNU to console"
dram_size = "0xC0000000"   # one 3 GiB DRAM window at 0xC0000000
panic_screen = false
# Entry probe (uncomment to bisect the kernel): a reboot N seconds after the
# stage bars means the probe point was reached.
# entry_probe_reset_delay = 6
# entry_probe_reset_after = "_machine_conf"
# entry_probe_reset_in = "_machine_startup"
kernel_args = [
  "-v",
  "keepsyms=1",
  "kt_fixed_zones=120",
]

# OnePlus ABL on kebab: header v2 / 4096-byte pages. "fastboot boot" is refused by
# ABL for unsigned images, so the image is flashed to boot_a.
#
# The dtb passed to mkbootimg MUST be the phone's own live device tree: the one
# shipped in Mu-Silicium has no cont_splash_region@9c000000 and ABL then refuses
# to hand the framebuffer over, which shows up as a black screen.
[bootimg.image]
header_version = 2
pagesize = 4096
kernel_offset = 0x8000
tags_offset = 0x100
dtb_offset = 0x1f00000

[adt.chosen.u32]
display-scale = 2
display-rotation = 0

[adt.defaults.u32]
sleep-disabled = 1
