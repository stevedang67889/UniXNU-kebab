# One repository per hardware driver, pulled in as a submodule under drivers/
# and declared here so "unixnu tree" links it where the build looks for it.

[[source]]
name = "KebabRamDisk"
kind = "driver"      # UEFI driver, referenced from [firmware] packages as {tree}/drivers/KebabRamDisk
local = "drivers/KebabRamDisk"
