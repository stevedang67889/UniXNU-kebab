version = 1

[boot]
timeout = 5
default = "xnu"

[ui]
title = "UniXNU - OnePlus 8T"

# The config volume is a FAT image flashed to any partition: UniXNU scans every
# SimpleFileSystem handle for \EFI\UniXNU\unixnu.toml. The kernel and its ADT
# live next to this file under Payloads/.
[[entry]]
id = "xnu"
title = "Boot XNU (kebab)"
type = "xnu"
path = "Payloads/kernel.macho"
dtb = "Payloads/kernel.macho.adt"
args = "-v serial=3 debug=0x14e"

[[entry]]
id = "reset"
title = "Restart"
type = "action"
action = "reset"

[[entry]]
id = "exit"
title = "Return to firmware"
type = "action"
action = "exit"
